<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>NEFT Payments</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
  <header class="topbar">
    <div class="brand">₹ NEFT Scheduler <span class="tag">demo</span></div>
    <nav>
      <a th:href="@{/payments}" class="active">Payments</a>
      <a th:href="@{/payments/new}">+ Schedule new</a>
    </nav>
  </header>
  <main class="container">
    <div th:if="${flash}" class="flash" th:text="${flash}"></div>

    <div class="row">
      <h1>Scheduled NEFT payments</h1>
      <form th:action="@{/payments/settle}" method="post">
        <button type="submit" class="ghost">Run settlement sweep</button>
      </form>
    </div>

    <div th:if="${#lists.isEmpty(payments)}" class="empty">
      No payments yet. <a th:href="@{/payments/new}">Schedule one</a>.
    </div>

    <table th:if="${!#lists.isEmpty(payments)}" class="grid">
      <thead>
        <tr>
          <th>UTR</th><th>Beneficiary</th><th>IFSC</th><th>A/c</th>
          <th class="num">Amount (₹)</th><th>Value date</th><th>Batch</th>
          <th>Status</th><th></th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="p : ${payments}">
          <td><a th:href="@{|/payments/${p.id}|}" th:text="${p.utr}">UTR</a></td>
          <td th:text="${p.beneficiaryName}"></td>
          <td th:text="${p.ifsc}"></td>
          <td th:text="${p.beneficiaryAccount}"></td>
          <td class="num" th:text="${#numbers.formatDecimal(p.amount,1,'COMMA',2,'POINT')}"></td>
          <td th:text="${p.valueDate}"></td>
          <td th:text="${p.batchSlot}"></td>
          <td>
            <span class="pill" th:classappend="${'pill-' + p.status}" th:text="${p.status}"></span>
          </td>
          <td>
            <form th:if="${p.status.name() == 'SCHEDULED'}"
                  th:action="@{|/payments/${p.id}/cancel|}" method="post">
              <button class="link danger">cancel</button>
            </form>
          </td>
        </tr>
      </tbody>
    </table>
  </main>
  <footer>NEFT batches half-hourly · Demo only · No real money moves.</footer>
</body>
</html>
